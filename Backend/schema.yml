      - password2
      - username
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        full_name:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 20
        last_name:
          type: string
          maxLength: 20
        username:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        phone_number:
          type: string
        state:
          oneOf:
          - $ref: '#/components/schemas/StateEnum'
          - $ref: '#/components/schemas/BlankEnum'
