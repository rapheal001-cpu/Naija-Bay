components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Category Name
        slug:
          type: string
          readOnly: true
          title: Category Slug
          pattern: ^[-a-zA-Z0-9_]+$
        sub_categories:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - sub_categories
    CategoryEnum:
      enum:
      - phones_tablets
      - electronics
      - vehicles
      - real_estate
      - fashion
      - home_garden
      - jobs
      - services
      - animals_pets
      - food_agriculture
      - health_beauty
      - kids_baby
      - sports_outdoor
      - books_music_movies
      type: string
      description: |-
        * `` - Select Category
        * `phones_tablets` - Phones & Tablets
        * `electronics` - Electronics
        * `vehicles` - Vehicles
        * `real_estate` - Real Estate
        * `fashion` - Fashion
        * `home_garden` - Home & Garden
        * `jobs` - Jobs
        * `services` - Services
        * `animals_pets` - Animals & Pets
        * `food_agriculture` - Food & Agriculture
        * `health_beauty` - Health & Beauty
        * `kids_baby` - Kids & Baby
        * `sports_outdoor` - Sports & Outdoor
        * `books_music_movies` - Books, Music & Movies
    ChatProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          readOnly: true
          title: Product Price
        state:
          readOnly: true
          title: Product State
          oneOf:
          - $ref: '#/components/schemas/StateEnum'
          - $ref: '#/components/schemas/BlankEnum'
        city:
          readOnly: true
          title: Product City
          oneOf:
          - $ref: '#/components/schemas/CityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        image:
          type: string
          nullable: true
          readOnly: true
      required:
      - city
      - id
      - image
      - price
      - product_name
      - product_slug
      - state
    ChatUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        store:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
      required:
      - avatar
      - full_name
      - id
      - is_active
      - store
