      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
          description: ''
    put:
      operationId: Update Store_2
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Store
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCreate'
          description: ''
    patch:
      operationId: Update Store
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Store
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStoreCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStoreCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStoreCreateRequest'
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCreate'
          description: ''
    delete:
      operationId: Delete Store
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Store
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/auth/token/refresh/:
    post:
      operationId: accounts_auth_token_refresh_create
      description: Generate new JWT access tokens using refresh tokens. Refresh tokens
        can be provided in request data or extracted automatically from HTTP cookies.
        Returns new access tokens with updated expiration times. New tokens are automatically
        set in HTTP cookies for secure storage.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CookieTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieTokenRefreshRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieTokenRefresh'
          description: ''
  /api/v1/accounts/auth/token/verify/:
    post:
      operationId: accounts_auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/auth/user/:
    get:
      operationId: Current User Profile
      description: Retrieve the authenticated user's profile information including
        username, email, first name, and last name. Password fields are excluded.
      tags:
      - User
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
    put:
      operationId: Update Current User_2
      description: Update the authenticated user's profile information. Allows modification
        of username, first name, and last name. Email field is read-only for security.
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomUserRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
    patch:
      operationId: Update Current User
      description: Partially update the authenticated user's profile information.
        Only provided fields will be updated. Email field is read-only.
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomUserRequest'
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
