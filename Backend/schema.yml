        * `new` - New
        * `used` - Used
        * `refurbished` - Refurbished
    ContactMethodsEnum:
      enum:
      - phone_call
      - whatsapp
      type: string
      description: |-
        * `` - Select Contact Method
        * `phone_call` - Phone Call
        * `whatsapp` - WhatsApp
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/ChatProduct'
          readOnly: true
        buyer:
          allOf:
          - $ref: '#/components/schemas/ChatUser'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/ChatUser'
          readOnly: true
        counterpart:
          allOf:
          - $ref: '#/components/schemas/ChatUser'
          nullable: true
          readOnly: true
        last_message:
          allOf:
          - $ref: '#/components/schemas/Message'
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          default: 0
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - buyer
      - counterpart
      - created_at
      - id
      - last_message
      - product
      - seller
      - unread_count
      - updated_at
    ConversationStartRequest:
      type: object
      description: Alias kept for schema clarity on the start-chat endpoint.
      properties:
        product:
          type: integer
        message:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - message
      - product
    CookieTokenRefresh:
      type: object
      description: JWT token refresh with cookie and request data support.
      properties:
        refresh:
          type: string
          description: Will override cookie.
        access:
          type: string
          readOnly: true
        access_expiration:
          type: string
          format: date-time
          readOnly: true
        refresh_expiration:
          type: string
          format: date-time
          readOnly: true
      required:
      - access
      - access_expiration
      - refresh_expiration
    CookieTokenRefreshRequest:
      type: object
      description: JWT token refresh with cookie and request data support.
      properties:
        refresh:
          type: string
          description: Will override cookie.
    CustomRegisterRequest:
