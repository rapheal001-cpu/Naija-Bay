          type: string
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        verified:
          type: boolean
          readOnly: true
          title: Verified Seller
        unread_notifications:
          type: integer
          default: 0
          readOnly: true
        store:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
