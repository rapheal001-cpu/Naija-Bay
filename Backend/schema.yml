openapi: 3.0.3
info:
  title: NaijaBay API
  version: 1.0.0
  description: NaijaBay Marketplace API — endpoints for accounts, products and verification.
  contact:
    name: NaijaBay Support
    email: support@naijabay.local
  license:
    name: Proprietary
paths:
  /api/v1/accounts/auth/create-store/:
    post:
      operationId: Create Or Update Store
      description: Create the authenticated user's store, or update it when it exists.
      tags:
      - Store
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
          description: ''
  /api/v1/accounts/auth/followers/{id}/:
    get:
      operationId: accounts_auth_followers_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFollowUserList'
          description: ''
  /api/v1/accounts/auth/following/{id}/:
    get:
      operationId: accounts_auth_following_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFollowUserList'
          description: ''
  /api/v1/accounts/auth/login/:
    post:
      operationId: Login
      description: Authenticate with username/email and password to obtain access
        tokens. Returns user details along with JWT access and refresh tokens with
        expiration times. Authentication cookies are set automatically for secure
        token storage.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/accounts/auth/logout/:
    post:
      operationId: Logout
      description: Logout user and invalidate authentication tokens. Blacklists JWT
        refresh tokens to prevent further use. Clears authentication cookies from
        the browser. Requires authentication to ensure only valid sessions can be
        logged out.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTLogout'
          description: ''
  /api/v1/accounts/auth/my-store/:
    get:
      operationId: My Store
      tags:
      - Store
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
          description: ''
  /api/v1/accounts/auth/notifications/:
    get:
      operationId: User Notifications
      tags:
      - User
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/accounts/auth/password/change/:
    post:
      operationId: Password Change
      description: 'Change the current user''s password. Requires authentication. '
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - JWTAuthentication: []
        JWTCookieAuthentication: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChange'
          description: ''
  /api/v1/accounts/auth/password/reset/:
    post:
      operationId: Password Reset
      description: Send password reset instructions to the provided email address.
        If the email is registered, a secure reset link will be sent. The link expires
        after a limited time for security.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
          description: ''
  /api/v1/accounts/auth/password/reset/confirm/:
    post:
      operationId: Password Reset Confirm
      description: Complete the password reset process using the token from the reset
        email. Requires the UID and token from the email along with the new password.
        The token is single-use and expires for security.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/accounts/auth/registration/:
    post:
      operationId: Register
      description: Register a new user account. Users must verify their email address
        before the account is fully activated.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: No response body
  /api/v1/accounts/auth/registration/resend-email/:
    post:
      operationId: Resend Email
      description: |-
        Send new email verification message.

        Args:
            request: The DRF request object
            *args: Variable length argument list
            **kwargs: Arbitrary keyword arguments

        Returns:
            DRF response with success message
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendEmailVerification'
          description: ''
  /api/v1/accounts/auth/registration/verify-email/:
    get:
      operationId: accounts_auth_registration_verify_email_retrieve
      description: GET method not allowed for email verification.
      tags:
      - accounts
      security:
      - cookieAuth: []
      - {}
      responses:
        '405':
          description: Method not allowed
    post:
      operationId: Verify Email
      description: |-
        Verify email address using confirmation key.

        Args:
            request: The DRF request object
            *args: Variable length argument list
            **kwargs: Arbitrary keyword arguments

        Returns:
            DRF response with verification result
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
          description: ''
  /api/v1/accounts/auth/store-detail/{slug}/:
    get:
      operationId: Store Detail
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
